name: Patch historical fixture UI

on:
  push:
    branches: [main]
    paths-ignore:
      - analysis_engine.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch UI
        run: python scripts/patch_analysis_history_ui.py
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis_engine.js
          git diff --cached --quiet || (git commit -m "Add historical opponent return accordion" && git push)
