name: Build historical player analysis

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/build_analysis.py"
      - "data/players.json"
      - "data/fixtures.json"
      - ".github/workflows/build-analysis.yml"
  schedule:
    - cron: "45 7,17 * * *"

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Top 30 analysis
        run: python scripts/build_analysis.py

      - name: Commit analysis dataset if changed
        run: |
          if git diff --quiet -- data/analysis.json; then
            echo "No analysis changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analysis.json
          git commit -m "Refresh historical Top 30 analysis"
          git pull --rebase --autostash
          git push
