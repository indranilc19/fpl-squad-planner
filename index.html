<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPL Squad Planner</title>
<meta name="description" content="Plan, analyse and optimise your Fantasy Premier League squad.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#101a2f;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--bg:#f5f7fa;--green:#16a34a;--green2:#dcfce7;--blue:#2563eb;--amber:#d97706;--amber2:#fef3c7;--red:#dc2626;--red2:#fee2e2;--pitch:#126b3a;--pitch2:#0c5830;--max:1500px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 24px;gap:26px}.brand{display:flex;align-items:center;gap:11px;min-width:230px}.mark{width:38px;height:38px;border-radius:10px;background:#16a34a;display:grid;place-items:center;font-size:20px}.brand h1{font-size:16px;margin:0;font-weight:800}.brand p{font-size:11px;color:#aab5cb;margin:3px 0}.topnav{display:flex;gap:4px;flex:1}.topnav button{background:transparent;border:0;color:#c6cede;padding:11px 14px;border-radius:8px;font-weight:700;font-size:13px}.topnav button.active,.topnav button:hover{background:#ffffff18;color:#fff}.global{width:250px;background:#1d2944;border:1px solid #34415c;color:#fff;border-radius:9px;padding:10px 12px}.layout{max-width:var(--max);margin:auto;display:grid;grid-template-columns:205px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 12px}.side-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af;padding:0 12px 8px}.side button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#596276;font-weight:600;font-size:13px;margin-bottom:3px}.side button.active,.side button:hover{background:#eff6ff;color:#2563eb}.main{padding:22px;min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.gw{display:flex;align-items:center;gap:8px}.gw button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 12px;font-weight:700;font-size:12px}.gw-label{font-weight:800;font-size:18px}.deadline{font-size:11px;color:var(--muted);margin-left:7px}.actions{display:flex;gap:8px}.primary{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important}.dark{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}.metric{background:#fff;padding:12px 15px}.metric span{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.metric strong{font-size:17px}.workspace{display:grid;grid-template-columns:minmax(430px,1.2fr) minmax(340px,.9fr) minmax(270px,.7fr);gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:14px}.card h2{font-size:14px;margin:0 0 4px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sub,.notice{font-size:11px;color:var(--muted)}.pitch{position:relative;background:linear-gradient(180deg,var(--pitch),var(--pitch2));border-radius:13px;overflow:hidden;min-height:590px;padding:45px 12px 25px}.pitch:before{content:"";position:absolute;inset:25px 9%;border:1px solid #ffffff59}.pitch:after{content:"";position:absolute;left:9%;right:9%;top:50%;border-top:1px solid #ffffff59}.circle{position:absolute;width:100px;height:100px;border:1px solid #ffffff59;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.formation{position:absolute;top:11px;left:11px;z-index:3;border:0;background:#fff;border-radius:8px;padding:8px 10px;font-weight:800;font-size:12px}.pitch-row{position:relative;z-index:2;display:flex;justify-content:center;gap:18px;margin:25px 0}.player{width:82px;text-align:center;color:#fff;position:relative}.avatar{width:45px;height:45px;border-radius:50%;background:#26384d;border:3px solid #ffffffd9;display:grid;place-items:center;margin:auto;font-size:10px;font-weight:800}.player.selected .avatar{background:var(--blue);box-shadow:0 0 0 4px #ffffff4d}.pname{font-size:10px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}.pmeta{font-size:9px;color:#d7f5e4;margin-top:2px}.badge{position:absolute;right:2px;top:-4px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;background:#111827;border:2px solid #fff}.badge.v{background:#2563eb}.injury{position:absolute;left:3px;top:-2px;width:9px;height:9px;border-radius:50%;background:#f59e0b;border:2px solid #fff}.fdr{display:inline-block;margin-top:4px;padding:3px 5px;border-radius:5px;font-size:8px;font-weight:800}.easy{background:var(--green2);color:#166534}.medium{background:var(--amber2);color:#92400e}.hard{background:var(--red2);color:#991b1b}.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.bench-card{border:1px solid var(--line);background:#fafafa;border-radius:9px;padding:9px;min-width:0}.bench-card b{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bench-card span{font-size:9px;color:var(--muted)}.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none;margin-bottom:9px}.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800;color:#64748b}.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}.player-table{max-height:500px;overflow:auto}.row{display:grid;grid-template-columns:1.65fr .5fr .65fr .55fr 1.1fr 30px;gap:6px;align-items:center;padding:9px 3px;border-bottom:1px solid #f0f1f3;font-size:10px}.row.header{font-size:8px;text-transform:uppercase;color:#9ca3af;font-weight:800;position:sticky;top:0;background:#fff}.row:not(.header):hover{background:#f8fafc}.player-name{font-weight:800}.team{font-size:9px;color:var(--muted);margin-top:2px}.plus{width:27px;height:27px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:17px}.plus:disabled{background:#e5e7eb;color:#9ca3af}.detail{position:sticky;top:14px}.hero{display:flex;gap:11px;align-items:center}.hero-avatar{width:60px;height:60px;border-radius:12px;background:#e9eef5;display:grid;place-items:center;font-weight:800;color:#334155}.hero-name{font-size:16px;font-weight:800}.hero-meta{font-size:10px;color:var(--muted);margin-top:3px}.price{font-size:14px;font-weight:800;margin-top:5px}.tabs{display:flex;gap:3px;margin:15px 0 12px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:transparent;padding:8px 9px;font-size:9px;font-weight:800;color:#6b7280}.tabs button.active{color:#111827;border-bottom:2px solid #111827}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.stat{background:#f8fafc;border-radius:8px;padding:9px}.stat span{font-size:9px;color:var(--muted);display:block}.stat strong{font-size:14px;display:block;margin-top:3px}.fixture-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}.fixture{padding:6px 2px;text-align:center;border-radius:6px;font-size:8px;font-weight:800}.alert{display:flex;gap:8px;padding:9px;border-radius:8px;background:#f8fafc;margin-bottom:7px;font-size:10px;line-height:1.35}.alert.good{background:#f0fdf4}.alert.warn{background:#fffbeb}.alert.info{background:#eff6ff}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px}.transfer{display:grid;grid-template-columns:1fr 30px 1fr;gap:8px;align-items:center}.slot{border:1px dashed #cbd5e1;border-radius:9px;padding:12px;min-height:65px;background:#fafafa}.slot b{font-size:10px}.slot span{display:block;color:var(--muted);font-size:9px;margin-top:4px}.swap{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff}.mobile-nav{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:9px;padding:10px 15px;font-size:12px;z-index:50}.hidden{display:none!important}
@media(max-width:1250px){.workspace{grid-template-columns:minmax(420px,1.1fr) minmax(320px,.9fr)}.detail{position:static;grid-column:1/-1}.global{display:none}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex;position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:7px;gap:5px}.mobile-nav button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:7px;font-size:10px;font-weight:800}.mobile-nav button.active{background:var(--navy);color:#fff}.workspace,.bottom{grid-template-columns:1fr}.topbar{padding:0 14px}.topnav{display:none}.main{padding:14px}.metrics{grid-template-columns:repeat(3,1fr)}.metric:nth-child(n+4){display:none}.detail{grid-column:auto}}
@media(max-width:560px){.brand{min-width:0}.brand h1{font-size:14px}.brand p{display:none}.toolbar{flex-direction:column;align-items:flex-start}.actions{width:100%}.actions .btn{flex:1}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(n+3){display:none}.pitch{min-height:500px}.pitch-row{gap:3px;margin:20px 0}.player{width:65px}.avatar{width:39px;height:39px}.pname{font-size:9px}.bench{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1.8fr .55fr .7fr 28px}.row>:nth-child(4),.row>:nth-child(5){display:none}.player-table{max-height:420px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="mark">⚽</div><div><h1>FPL Squad Planner</h1><p>Plan. Analyse. Play smarter.</p></div></div><nav class="topnav"><button data-view="planner" class="active">Squad Planner</button><button data-view="myteam">My Team</button><button data-view="fixtures">Fixtures</button><button data-view="news">News</button></nav><input id="global" class="global" placeholder="Search players, teams…"></header>
<div class="mobile-nav"><button data-view="planner" class="active">Planner</button><button data-view="myteam">My Team</button><button data-view="fixtures">Fixtures</button><button data-view="news">News</button></div>
<div class="layout"><aside class="sidebar"><div class="side-title">Workspace</div><div class="side"><button data-view="planner" class="active">▣ &nbsp; Squad Planner</button><button data-view="myteam">♙ &nbsp; My Team</button><button data-view="fixtures">▦ &nbsp; Fixtures</button><button data-view="news">▤ &nbsp; News</button></div><div class="side-title" style="margin-top:24px">Tools</div><div class="side"><button data-action="auto">✦ &nbsp; Auto-select XI</button><button data-action="reset">↺ &nbsp; Reset squad</button></div></aside><main class="main" id="main"></main></div>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
const B=1000,POS={1:'GK',2:'DEF',3:'MID',4:'FWD'},Q={1:2,2:5,3:5,4:3},FORM={'3-4-3':[3,4,3],'3-5-2':[3,5,2],'4-3-3':[4,3,3],'4-4-2':[4,4,2],'4-5-1':[4,5,1],'5-3-2':[5,3,2],'5-4-1':[5,4,1]},SK='fpl-squad-planner:v2',MK='fpl-squad-planner:meta:v2';
const s={players:[],teams:[],events:[],fixtures:[],view:'planner',gw:1,formation:'4-4-2',squad:[],cap:null,vice:null,selected:null,search:'',pos:0,team:{loading:false,error:'',data:null,id:''},filter:5};
const main=document.getElementById('main');
const pl=id=>s.players.find(x=>x.id===id),tm=id=>s.teams.find(x=>x.id===id),tn=id=>tm(id)?.short_name||'—',sq=()=>s.squad.map(pl).filter(Boolean),spent=()=>sq().reduce((a,p)=>a+p.now_cost,0),money=x=>'£'+(x/10).toFixed(1)+'m';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(SK,JSON.stringify(s.squad));localStorage.setItem(MK,JSON.stringify({formation:s.formation,cap:s.cap,vice:s.vice}))}catch(e){}}function load(){try{s.squad=JSON.parse(localStorage.getItem(SK)||'[]')}catch(e){}try{const m=JSON.parse(localStorage.getItem(MK)||'{}');s.formation=m.formation||'4-4-2';s.cap=m.cap||null;s.vice=m.vice||null}catch(e){}}
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.add('hidden'),2200)}
function fc(n){return n<=2?'easy':n===3?'medium':'hard'}
function fx(p,n=5){return s.fixtures.filter(f=>f.event>=s.gw&&(f.team_h===p.team||f.team_a===p.team)).sort((a,b)=>a.event-b.event).slice(0,n).map(f=>{const h=f.team_h===p.team;return{gw:f.event,opp:tn(h?f.team_a:f.team_h),home:h,diff:h?f.team_h_difficulty:f.team_a_difficulty}})}
function can(p){return !s.squad.includes(p.id)&&s.squad.length<15&&sq().filter(x=>x.element_type===p.element_type).length<Q[p.element_type]&&sq().filter(x=>x.team===p.team).length<3&&spent()+p.now_cost<=B}
function add(id){const p=pl(id);if(!p||!can(p))return;s.squad.push(id);s.selected=id;save();toast('Added '+p.second_name);render()}
function remove(id){s.squad=s.squad.filter(x=>x!==id);if(s.cap===id)s.cap=null;if(s.vice===id)s.vice=null;if(s.selected===id)s.selected=null;save();render()}
function score(p){const f=fx(p,3),a=f.length?f.reduce((x,y)=>x+y.diff,0)/f.length:3;return Number(p.form||0)*1.5+Number(p.total_points||0)/10+(6-a)}
function lineup(){const [d,m,f]=FORM[s.formation],by=t=>sq().filter(p=>p.element_type===t).sort((a,b)=>score(b)-score(a)),g=by(1),de=by(2),mi=by(3),fw=by(4),start=[...g.slice(0,1),...de.slice(0,d),...mi.slice(0,m),...fw.slice(0,f)];return{g:g.slice(0,1),de:de.slice(0,d),mi:mi.slice(0,m),fw:fw.slice(0,f),bench:sq().filter(p=>!start.includes(p))}}
function pc(p){const f=fx(p,1)[0];return `<div class="player ${s.selected===p.id?'selected':''}" data-player="${p.id}"><div class="avatar">${esc((p.first_name||'')[0])}${esc((p.second_name||'')[0])}</div>${s.cap===p.id?'<i class="badge">C</i>':''}${s.vice===p.id?'<i class="badge v">V</i>':''}${p.status&&p.status!=='a'?'<i class="injury"></i>':''}<div class="pname">${esc(p.second_name)}</div><div class="pmeta">${money(p.now_cost)}</div>${f?`<span class="fdr ${fc(f.diff)}">${f.opp} ${f.home?'H':'A'}</span>`:''}</div>`}
function pitch(){const l=lineup();return `<div class="card"><div class="card-head"><div><h2>Starting XI</h2><span class="sub">Select a player for details</span></div><select id="formation" class="formation">${Object.keys(FORM).map(x=>`<option ${x===s.formation?'selected':''}>${x}</option>`).join('')}</select></div><div class="pitch"><div class="circle"></div><div class="pitch-row">${l.fw.map(pc).join('')}</div><div class="pitch-row">${l.mi.map(pc).join('')}</div><div class="pitch-row">${l.de.map(pc).join('')}</div><div class="pitch-row">${l.g.map(pc).join('')}</div></div><div class="card-head" style="margin:12px 0 7px"><h2>Bench</h2><span class="sub">Reorder before deadline</span></div><div class="bench">${l.bench.map((p,i)=>`<div class="bench-card"><b>${i+1}. ${esc(p.second_name)}</b><span>${POS[p.element_type]} · ${money(p.now_cost)}</span></div>`).join('')||'<span class="notice">Complete your squad to populate the bench.</span>'}</div></div>`}
function playerList(){let a=s.players.filter(p=>{const q=(p.first_name+' '+p.second_name+' '+tn(p.team)).toLowerCase();return(!s.search||q.includes(s.search.toLowerCase()))&&(!s.pos||p.element_type===s.pos)}).sort((a,b)=>b.total_points-a.total_points).slice(0,180);return `<div class="card"><div class="card-head"><div><h2>Find players</h2><span class="sub">Search and compare before adding</span></div><span class="sub">${s.squad.length}/15</span></div><input id="search" class="search" placeholder="Search player or team…" value="${esc(s.search)}"><div class="filters">${[[0,'All'],[1,'GK'],[2,'DEF'],[3,'MID'],[4,'FWD']].map(x=>`<button class="chip ${s.pos===x[0]?'active':''}" data-pos="${x[0]}">${x[1]}</button>`).join('')}</div><div class="player-table"><div class="row header"><span>Player</span><span>Pos</span><span>Price</span><span>Form</span><span>Next fixtures</span><span></span></div>${a.map(p=>`<div class="row"><div><b class="player-name">${esc(p.first_name?.[0])}. ${esc(p.second_name)}</b><div class="team">${tn(p.team)}</div></div><span>${POS[p.element_type]}</span><span>${money(p.now_cost)}</span><span>${p.form||'—'}</span><span>${fx(p,3).map(z=>`<b class="fdr ${fc(z.diff)}" style="font-size:8px;margin-right:2px">${z.opp}</b>`).join('')}</span><button class="plus" data-add="${p.id}" ${can(p)?'':'disabled'}>${s.squad.includes(p.id)?'✓':'+'}</button></div>`).join('')}</div></div>`}
function detail(){let p=pl(s.selected)||sq()[0];if(!p)return `<div class="card detail"><h2>Player details</h2><p class="notice">Select a player from the pitch or player list.</p></div>`;const fs=fx(p,5);return `<div class="card detail"><div class="hero"><div class="hero-avatar">${esc((p.first_name||'')[0])}${esc((p.second_name||'')[0])}</div><div><div class="hero-name">${esc(p.first_name)} ${esc(p.second_name)}</div><div class="hero-meta">${tn(p.team)} · ${POS[p.element_type]}</div><div class="price">${money(p.now_cost)} <span class="sub">· ${p.selected_by_percent||'—'}% ownership</span></div></div></div><div class="tabs"><button class="active">Overview</button><button>Stats</button><button>Fixtures</button><button>News</button></div><div class="stat-grid"><div class="stat"><span>Form</span><strong>${p.form||'—'}</strong></div><div class="stat"><span>Total points</span><strong>${p.total_points}</strong></div><div class="stat"><span>Next GW chance</span><strong>${p.chance_of_playing_next_round==null?'—':p.chance_of_playing_next_round+'%'}</strong></div><div class="stat"><span>Ownership</span><strong>${p.selected_by_percent||'—'}%</strong></div></div><div style="margin-top:13px"><span class="sub">Next 5 Gameweeks</span><div class="fixture-grid">${fs.map(z=>`<div class="fixture ${fc(z.diff)}"><div>GW${z.gw}</div><div>${z.opp}</div><div>${z.home?'H':'A'}</div></div>`).join('')||'<span class="notice">No upcoming fixtures.</span>'}</div></div><p class="notice">Planner score: <b>${score(p).toFixed(1)}</b>. Transparent heuristic using form, total points and fixture difficulty — not an official FPL projection.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-cap="${p.id}">Set captain</button><button class="btn" data-vice="${p.id}">Set vice</button>${s.squad.includes(p.id)?`<button class="btn" data-remove="${p.id}">Remove</button>`:`<button class="btn primary" data-add="${p.id}" ${can(p)?'':'disabled'}>Add to squad</button>`}</div></div>`}
function alerts(){const a=[];a.push(s.squad.length===15?['good','✓','Squad is complete — 15 players selected.']:['warn','!','Squad has '+s.squad.length+'/15 players.']);a.push(['info','£','£'+((B-spent())/10).toFixed(1)+'m remaining in budget.']);a.push(s.cap?['good','C',(pl(s.cap)?.second_name||'Captain')+' is captain.']:['warn','C','Choose a captain before finalising.']);return `<div class="card"><div class="card-head"><h2>Squad alerts</h2><span class="sub">Decision checks</span></div>${a.map(x=>`<div class="alert ${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>`}
function fixtures(){const teams=s.teams.slice().sort((a,b)=>a.short_name.localeCompare(b.short_name)).slice(0,8);return `<div class="card"><div class="card-head"><div><h2>Fixture planner</h2><span class="sub">Next ${s.filter} Gameweeks · FPL difficulty</span></div><select id="filter" class="btn">${[3,5,8].map(n=>`<option ${n===s.filter?'selected':''}>${n}</option>`).join('')}</select></div>${teams.map(t=>{const fs=s.fixtures.filter(f=>f.event>=s.gw&&(f.team_h===t.id||f.team_a===t.id)).sort((a,b)=>a.event-b.event).slice(0,s.filter);return `<div style="display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:center;margin:7px 0"><b style="font-size:10px">${t.short_name}</b><div style="display:grid;grid-template-columns:repeat(${Math.max(fs.length,1)},1fr);gap:3px">${fs.map(f=>{const h=f.team_h===t.id,d=h?f.team_h_difficulty:f.team_a_difficulty;return `<div class="fixture ${fc(d)}">${tn(h?f.team_a:f.team_h)}<br>${h?'H':'A'}</div>`}).join('')}</div></div>`}).join('')}</div>`}
function transfer(){const p=pl(s.selected);return `<div class="card"><div class="card-head"><div><h2>Transfer planner</h2><span class="sub">Plan a move without changing your live FPL account</span></div></div><div class="transfer"><div class="slot"><b>OUT</b><span>${p&&s.squad.includes(p.id)?esc(p.second_name):'Select a squad player'}</span></div><button class="swap">→</button><div class="slot"><b>IN</b><span>Select a replacement from the player list</span></div></div><p class="notice">Next iteration: add transfer comparison, budget delta and fixture swing impact.</p></div>`}
function planner(){const e=s.events.find(x=>x.id===s.gw);main.innerHTML=`<div class="toolbar"><div class="gw"><button id="prev">‹</button><span class="gw-label">GW ${s.gw}</span><button id="next">›</button><span class="deadline">${e?.deadline_time?'Deadline '+new Date(e.deadline_time).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span></div><div class="actions"><button class="btn" data-action="reset">Reset</button><button class="btn dark" data-action="auto">Auto-select best XI</button><button class="btn primary" id="transfer">Plan transfer</button></div></div><div class="metrics"><div class="metric"><span>Squad value</span><strong>${money(spent())}</strong></div><div class="metric"><span>Money in bank</span><strong>${money(B-spent())}</strong></div><div class="metric"><span>Players selected</span><strong>${s.squad.length}/15</strong></div><div class="metric"><span>Captain</span><strong>${s.cap?esc(pl(s.cap)?.second_name||'—'):'—'}</strong></div><div class="metric"><span>Status</span><strong>${s.squad.length===15?'Ready':'Building'}</strong></div></div><div class="workspace"><div>${pitch()}</div><div>${playerList()}</div><div>${detail()}${alerts()}</div></div><div class="bottom">${fixtures()}${transfer()}</div>`;bindPlanner()}
function bindPlanner(){document.getElementById('formation')?.addEventListener('change',e=>{s.formation=e.target.value;save();render()});document.getElementById('search')?.addEventListener('input',e=>{s.search=e.target.value;const pos=document.querySelector('.player-table');if(pos){const wrap=document.createElement('div');wrap.innerHTML=playerList();pos.replaceWith(wrap.querySelector('.player-table'));document.getElementById('search')?.focus()}});document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{s.pos=+b.dataset.pos;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(+b.dataset.add));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(+b.dataset.remove));document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{s.selected=+b.dataset.player;render()});document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{s.cap=+b.dataset.cap;if(s.vice===s.cap)s.vice=null;save();toast('Captain updated');render()});document.querySelectorAll('[data-vice]').forEach(b=>b.onclick=()=>{s.vice=+b.dataset.vice;if(s.cap===s.vice)s.cap=null;save();toast('Vice-captain updated');render()});document.getElementById('prev')?.addEventListener('click',()=>gw(-1));document.getElementById('next')?.addEventListener('click',()=>gw(1));document.getElementById('filter')?.addEventListener('change',e=>{s.filter=+e.target.value;render()});document.getElementById('transfer')?.addEventListener('click',()=>{document.querySelector('.bottom')?.scrollIntoView({behavior:'smooth'});toast('Transfer planner ready')});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}
function gw(d){const i=s.events.findIndex(e=>e.id===s.gw),n=s.events[i+d];if(n){s.gw=n.id;render()}}function action(a){if(a==='auto'){if(!s.squad.length){toast('Add players first');return}const all=sq().sort((a,b)=>score(b)-score(a));s.cap=all[0]?.id||null;s.vice=all[1]?.id||null;save();toast('Best-XI heuristic applied — review it');render()}if(a==='reset'&&confirm('Reset your planner squad?')){s.squad=[];s.cap=null;s.vice=null;s.selected=null;save();render()}}
function nav(v){s.view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function myTeam(){const m=s.team;main.innerHTML=`<div class="card"><div class="card-head"><div><h2>My Team</h2><span class="sub">Load a public FPL team by entry ID</span></div></div><div style="display:flex;gap:8px"><input id="teamId" class="search" style="margin:0;flex:1" placeholder="FPL team ID" value="${esc(m.id)}"><button id="loadTeam" class="btn primary" ${m.loading?'disabled':''}>${m.loading?'Loading…':'Load team'}</button></div>${m.error?`<div class="alert warn" style="margin-top:10px">${esc(m.error)}</div>`:''}</div>${m.data?teamResult(m.data):''}`;document.getElementById('loadTeam')?.addEventListener('click',()=>loadTeam(document.getElementById('teamId').value));document.getElementById('teamId')?.addEventListener('keydown',e=>e.key==='Enter'&&loadTeam(e.target.value))}
function loadTeam(id){id=String(id).trim();if(!/^\d+$/.test(id)){s.team.error='Enter a numeric FPL team ID.';render();return}s.team={...s.team,id,loading:true,error:''};myTeam();fetch('/api/team?id='+encodeURIComponent(id)).then(r=>r.json().then(b=>({ok:r.ok,b}))).then(x=>{s.team.loading=false;if(!x.ok)s.team.error=x.b.error||'Team not found';else s.team.data=x.b;render()}).catch(()=>{s.team.loading=false;s.team.error='Network error reaching the FPL API proxy.';render()})}
function teamResult(d){const e=d.entry,p=d.picks;const rows=p?.picks?.map(x=>{const q=pl(x.element);return q?`<div class="row" style="grid-template-columns:1.7fr .5fr .5fr"><div><b>${esc(q.second_name)}</b><div class="team">${tn(q.team)}</div></div><span>${POS[q.element_type]}</span><span>${x.is_captain?'C':x.is_vice_captain?'V':''}</span></div>`:''}).join('')||'';return `<div class="card"><div class="metrics" style="margin:0 0 12px"><div class="metric"><span>Overall points</span><strong>${e.summary_overall_points??'—'}</strong></div><div class="metric"><span>Overall rank</span><strong>${e.summary_overall_rank?.toLocaleString()??'—'}</strong></div><div class="metric"><span>Team value</span><strong>${e.last_deadline_value?money(e.last_deadline_value):'—'}</strong></div><div class="metric"><span>Bank</span><strong>${e.last_deadline_bank!=null?money(e.last_deadline_bank):'—'}</strong></div><div class="metric"><span>Manager</span><strong>${esc(e.player_first_name||'')}</strong></div></div><button id="loadInto" class="btn primary">Load live squad into planner</button><div class="player-table" style="margin-top:12px">${rows}</div></div>`}
function fixturesView(){const gs=[...new Set(s.fixtures.map(f=>f.event))].sort((a,b)=>a-b).slice(0,8);main.innerHTML=`<div class="card"><div class="card-head"><div><h2>Fixtures</h2><span class="sub">FPL difficulty ratings: 1 easiest, 5 hardest</span></div></div>${gs.map(g=>`<div style="margin:15px 0"><b style="font-size:12px">Gameweek ${g}</b>${s.fixtures.filter(f=>f.event===g).map(f=>`<div class="row" style="grid-template-columns:1fr 70px"><span><b>${tn(f.team_h)}</b> vs <b>${tn(f.team_a)}</b></span><span><b class="fdr ${fc(f.team_h_difficulty)}">${f.team_h_difficulty}</b> <b class="fdr ${fc(f.team_a_difficulty)}">${f.team_a_difficulty}</b></span></div>`).join('')}</div>`).join('')}</div>`}
function news(){const n=s.players.filter(p=>p.news&&p.news.trim()).sort((a,b)=>(a.chance_of_playing_next_round??100)-(b.chance_of_playing_next_round??100));main.innerHTML=`<div class="card"><div class="card-head"><div><h2>Player availability</h2><span class="sub">Current notes from the FPL data feed</span></div></div>${n.map(p=>`<div class="alert ${p.chance_of_playing_next_round!=null&&p.chance_of_playing_next_round<50?'warn':'info'}"><b>${esc(p.second_name)}</b><span>${esc(p.news)} ${p.chance_of_playing_next_round!=null?'· '+p.chance_of_playing_next_round+'% chance':''}</span></div>`).join('')||'<p class="notice">No availability news in the current dataset.</p>'}</div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===s.view));if(s.view==='planner')planner();else if(s.view==='myteam')myTeam();else if(s.view==='fixtures')fixturesView();else news();bindNav()}
function bindNav(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.getElementById('loadInto')?.addEventListener('click',()=>{const p=s.team.data?.picks?.picks;if(!p)return;s.squad=p.map(x=>x.element).filter(id=>pl(id));s.cap=p.find(x=>x.is_captain)?.element||null;s.vice=p.find(x=>x.is_vice_captain)?.element||null;save();s.view='planner';toast('Live team loaded');render()})}
Promise.all([fetch('data/players.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/fixtures.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({fixtures:[]}))]).then(([p,f])=>{s.players=p.players||[];s.teams=p.teams||[];s.events=p.events||[];s.fixtures=f.fixtures||[];s.gw=(s.events.find(e=>e.is_next)||s.events.find(e=>e.is_current)||s.events[0])?.id||1;load();render()}).catch(()=>{main.innerHTML='<div class="card"><h2>Data unavailable</h2><p class="notice">Run the Refresh FPL data GitHub Action, then reload the site.</p></div>'});
})();
</script>
</body></html>
